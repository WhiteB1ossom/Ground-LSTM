replay:
  hardware_actuation_enabled: false
  max_active_events: 4
  max_event_seconds: 30
  max_saved_events: 1000
  minimum_consecutive_detections: 2
  mode: advisory
  off_threshold_ratio: 1.0
  post_event_seconds: 2
  pre_event_seconds: 5
  risk_off_threshold: 0.5
  risk_on_threshold: 0.5
  rule_combination: any
  rules:
  - operator: ge
    sensor: ground_voltage_a
    unit: V_AC
    value: 2
  - operator: ge
    sensor: ground_voltage_b
    unit: V_AC
    value: 2
  - operator: ge
    sensor: leakage_current
    unit: A
    value: 0.002
  - operator: ge
    sensor: limiter_temp_a
    unit: degC
    value: 45
  - operator: ge
    sensor: limiter_temp_b
    unit: degC
    value: 45
  - operator: ge
    sensor: limiter_temp_c
    unit: degC
    value: 45
  - operator: ge
    sensor: humidity
    unit: percent_RH
    value: 70
  shutdown_timeout_seconds: 5
  writer_queue_capacity: 64
schema_version: 1
