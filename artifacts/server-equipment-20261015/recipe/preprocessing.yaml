    \uC5C5\\\uD504\uB85C\uC81D\uD2B8\\artifacts\\scaler"
  segment_policy: acquisition
  split:
    mode: event
    purge_gap_seconds: 0
    ratios:
    - 0.6
    - 0.2
    - 0.2
  stale_action: missing_indicator
  windows:
    allow_event_crossing: true
    label_horizon_seconds: 0
    sequence_length: 64
    stride: 10
