pipeline:
  alignment_period_seconds: 0.1
  equipment_features:
    ambient_reference_degC: 25
    ambient_sensor: ambient_temp
    counter_sensor: lightning_sensor
    counter_window_seconds: 10
    input_voltage_reference: 220
    input_voltage_sensor: input_voltage
    limiter_sensors:
    - limiter_temp_a
    - limiter_temp_b
    - limiter_temp_c
    response_sensors:
    - ground_voltage_a
    - ground_voltage_b
