    post_event_seconds: 2
    pre_event_seconds: 5
  features:
  - current_value
  ground_voltage_difference: false
  include_age_features: true
  include_missing_indicators: true
  labeling:
    mapping:
      normal: 0
      risk: 1
    mode: binary
  output_directory: "C:\\Users\\bloss\\OneDrive\\\uBC14\uD0D5 \uD654\uBA74\\\uCDE8\
