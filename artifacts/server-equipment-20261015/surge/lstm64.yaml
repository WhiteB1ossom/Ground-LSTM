baseline:
  logistic_max_iter: 1000
  threshold_rules: []
evaluation:
  latency_repetitions: 10
  minimum_recall: 0.9
  threshold_objective: recall_then_f1
  threshold_search: validation_scores
  validation_threshold_candidates:
  - 0.3
  - 0.4
  - 0.5
  - 0.6
  - 0.7
input_contract:
  minimum_context_seconds: 6.4
  require_slow_sensor_age: true
labeling:
  ground_truth_mapping:
    normal: 0
    risk: 1
  mode: binary
  multiclass_semantics_confirmed: false
  unlabeled_action: stop_training
model:
  bidirectional: false
  dropout: 0.0
  hidden_units: 64
  num_layers: 1
  sequence_length: 64
  type: lstm
schema_version: 1
seed: 42
training:
  allow_synthetic_demo: true
  batch_size: 128
  class_weight: balanced
  deterministic: true
  early_stopping_min_delta: 0.0001
  early_stopping_patience: 8
  epochs: 50
  learning_rate: 0.001
  lr_schedule:
    enabled: true
    factor: 0.5
    min_learning_rate: 1.0e-05
    patience: 3
